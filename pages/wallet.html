<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Wallet - Lion AI PRO</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="dashboard">

<h1>🦁 کیف پول</h1>

<div class="card">
<h2>موجودی کل</h2>
<p id="ctrader-balance">در حال دریافت موجودی...</p>
</div>

<div class="card">
<h2>واریز</h2>
<p>اتصال کیف پول در مرحله بعد</p>
</div>

<div class="card">
<h2>برداشت</h2>
<p>امن و کنترل شده</p>
</div>

</div>


<script>
fetch("https://lionminiapp-production-a934.up.railway.app/ctrader/account?t=" + Date.now())
  .then(r => r.json())
  .then(j => {
    const a = j?.data?.data?.[0];
    if (j.ok && a) {
      document.getElementById("ctrader-balance").textContent =
        Number(a.balance).toLocaleString() + " " + a.depositCurrency;
    } else {
      document.getElementById("ctrader-balance").textContent =
        "خطا در دریافت موجودی";
    }
  })
  .catch(() => {
    document.getElementById("ctrader-balance").textContent =
      "خطا در اتصال به cTrader";
  });
</script>

</body>
</html>
