<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lion AI PRO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}
.logo{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  margin:15px 0 5px;
}
.sub{
  text-align:center;
  color:#8d99a8;
  margin-bottom:25px;
}
.card{
  background:#101722;
  border:1px solid #1e2a39;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.symbol{
  font-size:20px;
  font-weight:bold;
}
.price{
  font-size:35px;
  font-weight:bold;
  margin-top:10px;
}
.signal{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  padding:18px;
  border-radius:15px;
  margin:15px 0;
}
.buy{background:#063d2b;color:#27e59a}
.sell{background:#45151b;color:#ff5263}
.wait{background:#403510;color:#ffd45c}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.item{
  background:#0b111a;
  border-radius:12px;
  padding:12px;
}
.label{
  color:#8793a3;
  font-size:13px;
}
.value{
  margin-top:6px;
  font-size:18px;
  font-weight:bold;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#e9a91b;
  color:#080b10;
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
}
.status{
  text-align:center;
  color:#8d99a8;
  margin-top:12px;
  font-size:13px;
}
.reason{
  line-height:2;
  color:#cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🦁 Lion AI PRO</div>
<div class="sub">Real Market Intelligence</div>

<div class="card">

<div class="symbol">EUR/USD · 5 MIN</div>

<div id="price" class="price">--</div>

<div id="signal" class="signal wait">
WAIT
</div>

<div class="grid">

<div class="item">
<div class="label">RSI</div>
<div id="rsi" class="value">--</div>
</div>

<div class="item">
<div class="label">Score</div>
<div id="score" class="value">--</div>
</div>

<div class="item">
<div class="label">Confidence</div>
<div id="confidence" class="value">--</div>
</div>

<div class="item">
<div class="label">MA10</div>
<div id="ma10" class="value">--</div>
</div>

<div class="item">
<div class="label">MA30</div>
<div id="ma30" class="value">--</div>
</div>

<div class="item">
<div class="label">MACD</div>
<div id="macd" class="value">--</div>
</div>

<div class="item">
<div class="label">Support</div>
<div id="support" class="value">--</div>
</div>

<div class="item">
<div class="label">Resistance</div>
<div id="resistance" class="value">--</div>
</div>

</div>
</div>

<div class="card">
<div class="label">تحلیل Lion AI</div>
<div id="analysis" class="reason">در حال دریافت تحلیل...</div>
</div>

<button onclick="loadSignal()">🔄 بروزرسانی تحلیل</button>

<div id="status" class="status">
در حال اتصال به موتور تحلیل...
</div>

</div>

<script>

const API =
"https://lionminiapp-production.up.railway.app/signal";

async function loadSignal(){

  const status =
  document.getElementById("status");

  status.textContent =
  "در حال دریافت داده واقعی بازار...";

  try{

    const response =
    await fetch(API,{
      method:"GET",
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data =
    await response.json();

    if(data.status !== "ok"){
      throw new Error(
        data.message || "API Error"
      );
    }

    document.getElementById("price")
      .textContent = data.price;

    document.getElementById("rsi")
      .textContent = data.rsi;

    document.getElementById("score")
      .textContent = data.score;

    document.getElementById("confidence")
      .textContent = data.confidence+"%";

    document.getElementById("ma10")
      .textContent = data.ma10;

    document.getElementById("ma30")
      .textContent = data.ma30;

    document.getElementById("macd")
      .textContent = data.macd;

    document.getElementById("support")
      .textContent = data.support;

    document.getElementById("resistance")
      .textContent = data.resistance;

    const signal =
    document.getElementById("signal");

    signal.textContent =
      data.signal;

    signal.className =
      "signal " +
      (
        data.signal === "BUY"
        ? "buy"
        : data.signal === "SELL"
        ? "sell"
        : "wait"
      );

    document.getElementById("analysis")
      .textContent =
      data.analysis || "تحلیل آماده است.";

    status.textContent =
      "🟢 اتصال زنده · آخرین بروزرسانی موفق";

  }catch(error){

    console.error(error);

    document.getElementById("status")
      .textContent =
      "🔴 خطا در اتصال به API";

    document.getElementById("analysis")
      .textContent =
      "اتصال به موتور تحلیل برقرار نشد.";
  }
}

loadSignal();

setInterval(loadSignal,60000);

</script>

</body>
</html>
